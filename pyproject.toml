[project]
name = "flashcards-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Grat JUL", email = "hello@araucaria-software.cl" }
]
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.131",
    "httpx>=0.28.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
]

[project.scripts]
flashcards = "flashcards_agent.cli.loop:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
